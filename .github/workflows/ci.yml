name: ci

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings

  deploy:
    needs: analyze
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: peertask-pages
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build the site
        run: flutter build web --release --base-href /
      - uses: actions/setup-java@v4
        continue-on-error: true
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        id: android-sdk
        continue-on-error: true
      - name: Attach the release APK
        if: steps.android-sdk.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          flutter config --android-sdk "$ANDROID_HOME"
          yes | flutter doctor --android-licenses || true
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk build/web/peertask.apk
      - name: Require Cloudflare token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Add repository secret CLOUDFLARE_API_TOKEN (Pages deploy)."
            exit 1
          fi
      - name: Publish Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: a3a45ac9276a48dd649521958dfacdc4
          command: pages deploy build/web --project-name=peertask --commit-dirty=true
